{% extends "layout.html" %}

{% block title %}Reserve {{ book.title }}{% endblock %}

{% block content %}
<div class="card" style="max-width:480px;">
    <div class="card-body">
        <h4>Reserve "{{ book.title }}"?</h4>
        <p>All copies are currently checked out. We'll hold a spot for you and notify you when one becomes available.</p>
        <form method="post">
            {% csrf_token %}
            <button class="btn btn-primary" type="submit">Confirm reservation</button>
            <a href="{% url 'book_detail' id=book.id %}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
