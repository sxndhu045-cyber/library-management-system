<!DOCTYPE html>
<html>
<head>
    <title>Log in - Library Management System</title>
    <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', Arial, sans-serif;
            background:#F6F1E7; color:#2B2419; margin:0;
            display:flex; align-items:center; justify-content:center;
            min-height:100vh; padding:20px; box-sizing:border-box;
        }
        .login-shell {
            display:flex; max-width:760px; width:100%;
            border-radius:6px; overflow:hidden;
            border:1px solid #D8CBB0;
        }
        .login-hero {
            background:#2B2419; color:#F6F1E7;
            flex:1; padding:40px 32px;
            display:flex; align-items:center;
        }
        .login-hero h1 {
            font-family:'Source Serif 4', Georgia, serif;
            font-size:24px; font-weight:700; line-height:1.4; margin:0;
        }
        .login-hero p {
            font-size:13px; color:#C9BFA8; margin-top:10px;
        }
        .login-form-panel {
            flex:1; background:#FFFDF8; padding:40px 32px;
        }
        .eyebrow {
            font-size:12px; text-transform:uppercase; letter-spacing:0.08em;
            color:#8A6D4A; font-weight:500; margin-bottom:8px;
        }
        .login-form-panel h2 {
            font-family:'Source Serif 4', Georgia, serif;
            font-size:20px; font-weight:700; margin:0 0 20px;
        }
        form p { margin:0 0 14px; }
        form label { font-size:13px; color:#7A6B52; display:block; margin-bottom:4px; }
        form input {
            width:100%; padding:9px; border-radius:2px;
            border:1.5px solid #D8CBB0; box-sizing:border-box;
            font-family:'Inter', sans-serif; font-size:14px;
            background:#FFFDF8; color:#2B2419;
        }
        form input:focus { outline:none; border-color:#2B2419; }
        .btn {
            width:100%; padding:10px; border-radius:2px; border:none;
            background:#2B2419; color:#F6F1E7; font-size:14px;
            font-weight:500; cursor:pointer; margin-top:6px;
        }
        .btn:hover { background:#453B29; }
        .errorlist { color:#A05C42; list-style:none; padding:0; font-size:13px; }
        .hint { color:#7A6B52; font-size:13px; margin-top:20px; }

        @media (max-width: 700px) {
            .login-shell { flex-direction:column; }
            .login-hero { padding:28px 24px; }
        }
    </style>
</head>
<body>
    <div class="login-shell">
        <div class="login-hero">
            <div>
                <h1>Welcome back,<br>reader.</h1>
                <p>Your next book is waiting.</p>
            </div>
        </div>
        <div class="login-form-panel">
            <div class="eyebrow">Sign in</div>
            <h2>The Library</h2>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button class="btn" type="submit">Log in</button>
            </form>
            <p class="hint">Don't have an account? Ask your librarian for your login ID and password.</p>
        </div>
    </div>
</body>
</html>
